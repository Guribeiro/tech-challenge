name: Deploy to EKS

on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy application to EKS
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'oficina-app' }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER || 'oficina-eks' }}
      K8S_NAMESPACE: oficina-mecanica
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      DB_USER: ${{ vars.DB_USER || 'postgres' }}
      DB_NAME: ${{ vars.DB_NAME || 'oficina_db' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configurar acesso ao cluster EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Validar secrets do deploy
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          for variable in DB_PASSWORD JWT_SECRET; do
            if [[ -z "${!variable}" ]]; then
              echo "Secret do GitHub ausente: $variable. Configure-o em Settings > Secrets and variables > Actions." >&2
              exit 1
            fi
          done

      - name: Aplicar infraestrutura da aplicação
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          database_url="postgresql://${DB_USER}:${DB_PASSWORD}@postgres-service:5432/${DB_NAME}?schema=public"

          kubectl apply -f k8s/eks/namespace.yaml
          kubectl create secret generic oficina-db-secret \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=POSTGRES_USER="$DB_USER" \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=POSTGRES_DB="$DB_NAME" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic oficina-app-secret \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=DATABASE_URL="$database_url" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/eks/postgres.yaml
          kubectl wait --for=condition=ready pod -l app=postgres \
            --namespace "$K8S_NAMESPACE" --timeout=180s

      - name: Obter conta AWS
        id: account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Executar migrations e publicar a aplicação
        env:
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          set -euo pipefail
          ecr_registry="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_uri="${ecr_registry}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          rendered_app="$(mktemp)"
          rendered_job="$(mktemp)"
          trap 'rm -f "$rendered_app" "$rendered_job"' EXIT

          sed "s|__IMAGE_URI__|${image_uri}|g" k8s/eks/app.yaml > "$rendered_app"
          sed "s|__IMAGE_URI__|${image_uri}|g" k8s/eks/migration-job.yaml > "$rendered_job"

          kubectl delete job oficina-prisma-migrate \
            --namespace "$K8S_NAMESPACE" --ignore-not-found
          kubectl apply -f "$rendered_job"
          kubectl wait --for=condition=complete job/oficina-prisma-migrate \
            --namespace "$K8S_NAMESPACE" --timeout=180s
          kubectl apply -f "$rendered_app"
          kubectl rollout status deployment/oficina-app-deployment \
            --namespace "$K8S_NAMESPACE" --timeout=180s

      - name: Exibir endpoint da aplicação
        run: kubectl get service oficina-service --namespace "$K8S_NAMESPACE"
