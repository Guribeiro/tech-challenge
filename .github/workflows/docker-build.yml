name: Docker Build & Push

on:
  workflow_run:
    workflows: ["Quality & Tests"]
    types:
      - completed
    branches:
      - develop
      - main

jobs:
  build-and-push:
    # Somente após lint, testes unitários e e2e aprovados, e apenas para pushes
    # (PRs não publicam imagem).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'producao' || 'homologacao' }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'oficina-app' }}
      ENV_TAG: ${{ github.event.workflow_run.head_branch == 'main' && 'prd' || 'hml' }}
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configurar credenciais AWS do Learner Lab
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem de produção
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_SHA }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.ENV_TAG }}-latest

      - name: Resumo
        run: |
          {
            echo "### Imagem publicada"
            echo "- Ambiente: \`${ENV_TAG}\`"
            echo "- Imagem: \`${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
