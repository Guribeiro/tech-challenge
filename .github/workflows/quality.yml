name: Quality & Tests

on:
  push:
    branches: [ "main", "fase-2" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Job de Lint (execução ultra-rápida, sem banco)
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint

  # 2. Job de Testes Unitários (em paralelo, sem serviço de banco)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Executar Testes Unitários
        run: npm run test

  # 3. Job de Testes E2E (em paralelo, isolando o container do Postgres)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina_test_db
        ports:
          - 5432:5433
        options: >-
          --health-cmd "pg_isready -U postgres -d oficina_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/oficina_test_db?schema=public

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate
        
      - name: Executar Testes End-to-End (E2E)
        run: npm run test:e2e
        env:
          NODE_ENV: test