version: '3.8'

services:
  # Serviço do Banco de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: fiap_tech_challenge_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oficina_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oficina_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
  postgres-test:
    image: postgres:16-alpine
    container_name: fiap_tech_challenge_db_test
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-oficina_test_db}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    # Dica: tmpfs guarda os dados dos testes na RAM, acelerando a execução e descartando sujeira no restart
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-postgres} -d ${POSTGRES_TEST_DB:-oficina_test_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Serviço da Aplicação NestJS
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiap_tech_challenge_app
    ports:
      - "${PORT:-3000}:3000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-oficina_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    command: npm run start:dev

volumes:
  pgdata:
    driver: local