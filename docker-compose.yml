services:
  # Serviço do Banco de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: fiap_tech_challenge_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oficina_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oficina_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
  postgres-test:
    image: postgres:16-alpine
    container_name: fiap_tech_challenge_db_test
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-oficina_test_db}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    # Dica: tmpfs guarda os dados dos testes na RAM, acelerando a execução e descartando sujeira no restart
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-postgres} -d ${POSTGRES_TEST_DB:-oficina_test_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
  postgres-sonar:
    image: postgres:15-alpine
    container_name: fiap_tech_challenge_db_sonar
    restart: always
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
    volumes:
      - sonar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Serviço do SonarQube
  sonarqube:
    image: sonarqube:community
    container_name: fiap_tech_challenge_sonarqube
    restart: always
    ports:
      - "${SONAR_PORT:-9000}:9000"
    environment:
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER:-sonar}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:-sonar}
      - SONAR_JDBC_URL=jdbc:postgresql://postgres-sonar:5432/${SONAR_DB_NAME:-sonar}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      postgres-sonar:
        condition: service_healthy
  
  # Serviço da Aplicação NestJS
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: fiap_tech_challenge_app
    ports:
      - "${PORT:-3000}:3000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-oficina_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev

volumes:
  pgdata:
  sonar_pgdata:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: