apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: oficina-app
      app.kubernetes.io/part-of: oficina-mecanica
    includeSelectors: false

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

images:
  - name: oficina-app
    newName: oficina-app
    newTag: latest
