# Seed demonstrativo (destrutivo): executado apenas com SEED=true no scripts/deploy.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-prisma-seed
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prisma-seed
          image: oficina-app
          command: ["npx", "prisma", "db", "seed"]
          envFrom:
            - secretRef:
                name: oficina-app-secret
