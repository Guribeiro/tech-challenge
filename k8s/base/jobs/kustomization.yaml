apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Jobs de banco aplicados separadamente pelo scripts/deploy.sh:
# migration antes de cada rollout; seed somente com SEED=true.
labels:
  - pairs:
      app.kubernetes.io/name: oficina-app
      app.kubernetes.io/part-of: oficina-mecanica
    includeSelectors: false

resources:
  - migration-job.yaml
  - seed-job.yaml
