# Aplicado separadamente pelo scripts/deploy.sh antes do rollout da API.
apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-prisma-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: prisma-migrate
          image: oficina-app
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: oficina-app-secret
