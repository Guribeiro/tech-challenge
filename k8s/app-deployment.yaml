apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-app
  template:
    metadata:
      labels:
        app: oficina-app
    spec:
      containers:
      - name: oficina-app
        image: oficina-app:latest # Imagem gerada localmente para o Kind
        imagePullPolicy: IfNotPresent # Crucial para o Kind usar a imagem do Docker local sem tentar baixar da internet
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: oficina-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: oficina-secret
              key: DATABASE_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-service
spec:
  type: NodePort # Melhor que LoadBalancer para o Kind
  selector:
    app: oficina-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30000 # Porta fixa para acessar facilmente do host