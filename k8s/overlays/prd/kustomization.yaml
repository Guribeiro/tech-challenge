apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina-prd

labels:
  - pairs:
      oficina-env: prd
    includeSelectors: false

resources:
  - namespace.yaml
  - ../../base

replicas:
  - name: oficina-app-deployment
    count: 2

patches:
  - target:
      kind: ConfigMap
      name: oficina-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: prd
      - op: replace
        path: /data/NEW_RELIC_APP_NAME
        value: oficina-app-prd
  - target:
      kind: Service
      name: oficina-service
    patch: |-
      - op: replace
        path: /metadata/annotations/service.beta.kubernetes.io~1aws-load-balancer-additional-resource-tags
        value: oficina-app=api,oficina-env=prd
  - target:
      kind: HorizontalPodAutoscaler
      name: oficina-app-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4

images:
  - name: oficina-app
    newName: oficina-app
    newTag: latest
